name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses & install platform/build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | sort -r | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build-log.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -n 400 build-log.txt

      - name: Save build log to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-log.txt "ci-logs/build-log-${GITHUB_RUN_ID}.txt"
          git add -f "ci-logs/build-log-${GITHUB_RUN_ID}.txt"
          git commit -m "ci: build log for run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Fail job if build failed
        if: steps.build.outputs.exit != '0'
        run: exit 1

      - name: Commit APK to repo (so it can be fetched without blob storage)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/chess-debug.apk
          git add -f releases/chess-debug.apk
          git commit -m "ci: publish built APK (run ${GITHUB_RUN_ID}) [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
